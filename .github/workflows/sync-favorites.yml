name: Sync Favorites to Gist

on:
  workflow_dispatch:
    inputs:
      favorites_data:
        description: 'JSON data of favorites to sync'
        required: true
        type: string

  repository_dispatch:
    types: [sync-favorites]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Save favorites data
        run: |
          DATA='${{ github.event.inputs.favorites_data || github.event.payload.favorites_data }}'
          echo "$DATA" > favorites.json
          echo "Saved favorites:" && cat favorites.json

      - name: Sync to Gist
        run: |
          cat favorites.json | gh gist edit ${{ vars.GIST_ID }} favorites.json
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
