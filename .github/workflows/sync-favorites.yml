name: Sync Favorites to Gist

on:
  workflow_dispatch:
    inputs:
      favorites_data:
        description: 'JSON data of favorites to sync'
        required: true
        type: string

  repository_dispatch:
    types: [sync-favorites]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Save favorites data
        env:
          FAVORITES_DATA: ${{ github.event.inputs.favorites_data || github.event.payload.favorites_data }}
        run: |
          printf '%s' "$FAVORITES_DATA" > favorites.json
          jq -e . favorites.json > /dev/null
          echo "Validated favorites JSON without printing its contents."

      - name: Sync to Gist
        run: gh gist edit "$GIST_ID" --filename favorites.json favorites.json
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
