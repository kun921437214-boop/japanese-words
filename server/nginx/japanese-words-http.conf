server {
    listen 80;
    listen [::]:80;
    server_name bijinihaitan.cn www.bijinihaitan.cn;

    root /opt/japanese-words/app/dist;
    index index.html;
    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ ^/(ai-candidates|ai-cards|codex-daily|codex-image|daily-refresh|favorites|healthz|published-cover|published-import|published-refresh|rankings|today-snapshot)$ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_buffering off;
    }

    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|css|js|mjs)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ /\. {
        deny all;
    }
}
