server {
    listen 80;
    listen [::]:80;
    server_name bijinihaitan.cn www.bijinihaitan.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://bijinihaitan.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bijinihaitan.cn;

    ssl_certificate /etc/nginx/ssl/bijinihaitan.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/bijinihaitan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/japanese-words/app/dist;
    index index.html;
    client_max_body_size 8m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    location ~ ^/(ai-candidates|ai-cards|codex-daily|codex-image|daily-refresh|favorites|healthz|published-cover|published-import|published-refresh|rankings|today-snapshot)$ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_buffering off;
    }

    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bijinihaitan.cn;
    ssl_certificate /etc/nginx/ssl/bijinihaitan.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/bijinihaitan.cn.key;
    return 301 https://bijinihaitan.cn$request_uri;
}
