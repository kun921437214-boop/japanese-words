name = "japanese-words-sync"
main = "worker/favorites-worker.js"
compatibility_date = "2026-04-29"
workers_dev = true
preview_urls = false

[vars]
SITE_URL = "https://jiyimianbao.pages.dev"

[triggers]
# Production scheduling moved to the Tencent runtime. Keep this Worker and its
# bindings intact for rollback, but do not run a second scheduler.
crons = []

[[kv_namespaces]]
binding = "FAVORITES"
id = "969904de6cf24fe6982d2b8ee01c9b1a"

[[durable_objects.bindings]]
name = "WORKFLOW_COORDINATOR"
class_name = "WorkflowCoordinator"
script_name = "japanese-words-workflow-coordinator"

[env.preview]
name = "japanese-words-sync-preview"
workers_dev = true
preview_urls = false

[env.preview.vars]
SITE_URL = "https://jiyimianbao.pages.dev"
ENABLE_LEGACY_WORKER_API = "false"

[[env.preview.kv_namespaces]]
binding = "FAVORITES"
id = "d4d4852d9be04115830789aaffbf4aca"

[[env.preview.durable_objects.bindings]]
name = "WORKFLOW_COORDINATOR"
class_name = "WorkflowCoordinator"
script_name = "japanese-words-workflow-coordinator-preview"
